<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Places of the ŠKZ</title>
<style>
:root{
  --bg:#f6f4ef; --panel:#fffdf8; --ink:#241f1a; --dim:#6e655b; --faint:#9a9086;
  --rule:#ddd5c8; --rule2:#eae3d7; --sea:#e7ebee; --land:#ece7dc; --coast:#b9ae9d;
  --city:#8c2f26; --region:#2f5d6e; --phys:#5b6b34; --unres:#877e73;
  --mark:#f3e2a8; --accent:#8c2f26; --shadow:rgba(60,45,25,.13);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171513; --panel:#201d1a; --ink:#ece5da; --dim:#a79d90; --faint:#7d7469;
  --rule:#3a342d; --rule2:#2b2622; --sea:#14181b; --land:#272320; --coast:#5c5347;
  --city:#d97a6c; --region:#77b0c4; --phys:#a3b972; --unres:#9a9188;
  --mark:#5a4a1d; --accent:#d97a6c; --shadow:rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  --bg:#171513; --panel:#201d1a; --ink:#ece5da; --dim:#a79d90; --faint:#7d7469;
  --rule:#3a342d; --rule2:#2b2622; --sea:#14181b; --land:#272320; --coast:#5c5347;
  --city:#d97a6c; --region:#77b0c4; --phys:#a3b972; --unres:#9a9188;
  --mark:#5a4a1d; --accent:#d97a6c; --shadow:rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.5 "Gentium Plus","Gentium Book Basic",Cardo,"New Athena Unicode","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  -webkit-font-smoothing:antialiased}
h1,h2,h3{font-weight:600;margin:0}
a{color:var(--accent)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
mark{background:var(--mark);color:inherit;padding:.05em .1em;border-radius:2px}

#shell{display:flex;flex-direction:column;height:100dvh}
header.top{display:flex;align-items:baseline;gap:.85rem;flex-wrap:wrap;
  padding:.7rem 1.1rem;border-bottom:1px solid var(--rule);background:var(--panel)}
header.top h1{font-size:1.06rem;letter-spacing:.01em}
header.top .sub{font-size:.8rem;color:var(--dim);font-family:system-ui,sans-serif}
header.top .spacer{flex:1}
.ghost{font-family:system-ui,sans-serif;font-size:.74rem;color:var(--dim);
  border:1px solid var(--rule);border-radius:4px;padding:.24rem .55rem}
.ghost:hover{border-color:var(--accent);color:var(--accent)}

#main{flex:1;display:flex;min-height:0}
#mapwrap{flex:1;position:relative;min-width:0;background:var(--sea)}
#map{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#map.drag{cursor:grabbing}

.mapctl{position:absolute;display:flex;gap:.3rem;font-family:system-ui,sans-serif;font-size:.74rem}
.mapctl.tl{top:.6rem;left:.6rem;flex-direction:column;align-items:flex-start}
.mapctl.br{bottom:.6rem;right:.6rem}
.chipbar{display:flex;gap:.3rem;flex-wrap:wrap;max-width:min(52ch,60vw)}
.chip{background:var(--panel);border:1px solid var(--rule);border-radius:999px;
  padding:.2rem .6rem;color:var(--dim);display:flex;align-items:center;gap:.36rem;
  box-shadow:0 1px 3px var(--shadow)}
.chip .sw{width:.62rem;height:.62rem;border-radius:50%;flex:none}
.chip[aria-pressed="false"]{opacity:.42}
.chip .short{display:none}
.chip:hover{border-color:var(--accent)}
.sqbtn{background:var(--panel);border:1px solid var(--rule);border-radius:4px;
  width:1.75rem;height:1.75rem;line-height:1;color:var(--dim);
  box-shadow:0 1px 3px var(--shadow);font-size:.95rem}
.sqbtn:hover{border-color:var(--accent);color:var(--accent)}
.scalebar{position:absolute;left:.6rem;bottom:.6rem;font-family:system-ui,sans-serif;
  font-size:.68rem;color:var(--dim)}
.scalebar .bar{height:.3rem;border:1px solid var(--coast);border-top:0;margin-bottom:.14rem}

#tip{position:absolute;pointer-events:none;background:var(--panel);color:var(--ink);
  border:1px solid var(--rule);border-radius:4px;padding:.2rem .48rem;font-size:.8rem;
  box-shadow:0 2px 8px var(--shadow);opacity:0;transition:opacity .09s;white-space:nowrap;z-index:5}

.dot{cursor:pointer}
.dot.dim{opacity:.15}
.lbl{font-size:10.5px;fill:var(--ink);paint-order:stroke;stroke:var(--sea);stroke-width:2.6px;
  stroke-linejoin:round;pointer-events:none;font-family:system-ui,sans-serif}
.lbl.sel{font-weight:700}

#panel{width:420px;flex:none;border-left:1px solid var(--rule);background:var(--panel);
  display:flex;flex-direction:column;min-height:0}
#search{padding:.6rem .85rem;border-bottom:1px solid var(--rule2);display:flex;gap:.45rem;align-items:center}
#q{flex:1;font:inherit;font-size:.9rem;background:var(--bg);color:var(--ink);
  border:1px solid var(--rule);border-radius:4px;padding:.34rem .55rem}
#q:focus{outline:2px solid var(--accent);outline-offset:-1px}
#body{overflow-y:auto;flex:1;overscroll-behavior:contain}

.whynot{padding:0 .85rem .45rem;font-family:system-ui,sans-serif;font-size:.73rem;
  color:var(--dim);line-height:1.45;border-bottom:1px solid var(--rule2)}
.listhead{padding:.6rem .85rem .3rem;font-family:system-ui,sans-serif;font-size:.7rem;
  letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.row{display:flex;gap:.55rem;align-items:baseline;width:100%;text-align:left;
  padding:.4rem .85rem;border-bottom:1px solid var(--rule2)}
.row:hover{background:var(--bg)}
.row.sel{background:var(--bg);box-shadow:inset 3px 0 0 var(--accent)}
.row .sw{width:.55rem;height:.55rem;border-radius:50%;flex:none;transform:translateY(-1px)}
.row .nm{flex:1;min-width:0}
.row .gk{display:block;font-size:.8rem;color:var(--dim);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.row .n{font-family:system-ui,sans-serif;font-size:.7rem;color:var(--faint);flex:none}
.row.unloc .sw{background:none !important;border:1px dashed var(--faint)}

#detail{padding:.2rem 0 3rem}
.back{padding:.5rem .85rem;font-family:system-ui,sans-serif;font-size:.78rem;color:var(--dim)}
.back:hover{color:var(--accent)}
.dhead{padding:.1rem .85rem .7rem;border-bottom:1px solid var(--rule)}
.dhead h2{font-size:1.24rem;line-height:1.25}
.meta{font-family:system-ui,sans-serif;font-size:.75rem;color:var(--dim);margin-top:.3rem;
  display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}
.tag{border:1px solid var(--rule);border-radius:3px;padding:.05rem .35rem}
.tag.warn{border-color:var(--city);color:var(--city)}
sec{display:block;padding:.85rem .85rem 0}
sec > h3{font-family:system-ui,sans-serif;font-size:.7rem;letter-spacing:.09em;
  text-transform:uppercase;color:var(--faint);margin-bottom:.45rem}
.names{width:100%;border-collapse:collapse}
.names th{text-align:left;font-family:system-ui,sans-serif;font-weight:400;font-size:.74rem;
  color:var(--dim);padding:.22rem .55rem .22rem 0;vertical-align:baseline;white-space:nowrap;width:1%}
.names td{padding:.22rem 0;vertical-align:baseline}
.att{border-left:2px solid var(--rule);padding:0 0 .1rem .7rem;margin-bottom:.9rem}
.att .ln{font-family:system-ui,sans-serif;font-size:.72rem;color:var(--faint);
  letter-spacing:.05em;text-transform:uppercase;margin-bottom:.25rem}
.att .form{font-size:1rem;margin-bottom:.4rem}
.att .form span+span::before{content:" · ";color:var(--faint)}
.v{margin:.3rem 0;font-size:.88rem;line-height:1.55}
.v b{font-family:system-ui,sans-serif;font-weight:400;font-size:.68rem;color:var(--faint);
  letter-spacing:.06em;text-transform:uppercase;margin-right:.4rem}
.verb{white-space:pre-wrap;font-size:.86rem;line-height:1.55;background:var(--bg);
  border:1px solid var(--rule2);border-left:2px solid var(--rule);border-radius:0 3px 3px 0;
  padding:.55rem .65rem}
.cite{font-family:system-ui,sans-serif;font-size:.72rem;color:var(--faint);margin-top:.35rem}
.kprov{font-family:system-ui,sans-serif;font-size:.72rem;color:var(--faint);
  line-height:1.45;margin-bottom:.6rem}
.ksec{border-left:2px dashed var(--rule);padding-left:.7rem;margin-bottom:.95rem}
.khead{font-family:system-ui,sans-serif;font-size:.74rem;color:var(--dim);
  display:flex;flex-wrap:wrap;gap:.35rem;align-items:baseline;margin-bottom:.3rem}
.khead b{color:var(--ink);font-weight:600}
.kbadge{border:1px solid var(--rule);border-radius:3px;padding:.02rem .3rem;
  font-size:.68rem;color:var(--faint)}
.klem{font-size:.92rem;margin-bottom:.3rem}
.ksum{font-size:.88rem;line-height:1.55}
.kid{font-size:.86rem;line-height:1.5;margin-top:.45rem;padding-left:.6rem;
  border-left:1px solid var(--rule2)}
.krt{font-size:.86rem;line-height:1.5;margin-top:.45rem}
.krt > div{margin-bottom:.3rem}
.kdim{color:var(--dim);font-size:.82rem;line-height:1.5;margin-top:.35rem}
details.kfn, details.kmore{margin-top:.4rem}
details.kfn > summary, details.kmore > summary{font-family:system-ui,sans-serif;
  font-size:.74rem;color:var(--dim);cursor:pointer;padding:.15rem 0}
details.kfn > summary:hover, details.kmore > summary:hover{color:var(--accent)}
details.kmore{border-top:1px solid var(--rule2);padding-top:.35rem}
.ids{font-family:system-ui,sans-serif;font-size:.8rem}
.ids div{padding:.15rem 0}
.ids .k{color:var(--dim);display:inline-block;min-width:6.8rem}
.nearby{display:flex;flex-wrap:wrap;gap:.35rem}
.nchip{display:flex;align-items:center;gap:.35rem;font-size:.8rem;
  border:1px solid var(--rule);border-radius:999px;padding:.16rem .55rem;color:var(--ink)}
.nchip:hover{border-color:var(--accent);color:var(--accent)}
.nchip .sw{width:.5rem;height:.5rem;border-radius:50%;flex:none}
.note{font-size:.86rem;color:var(--dim)}
.empty{padding:1.4rem .85rem;color:var(--faint);font-size:.88rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

@media (max-width:860px){
  #main{flex-direction:column}
  #mapwrap{height:48vh;flex:none}
  #panel{width:auto;flex:1;border-left:0;border-top:1px solid var(--rule)}
  .chipbar{max-width:70vw}
}
@media (max-width:620px){
  .chip .full{display:none}
  .chip .short{display:inline}
  .chip{padding:.18rem .5rem;font-size:.7rem}
}
</style>
</head>
<body>
<div id="shell">
  <header class="top">
    <h1>Places of the ŠKZ</h1>
    <span class="sub" id="counts"></span>
    <span class="spacer"></span>
    <button class="ghost" id="lblbtn" aria-pressed="true">Labels</button>
    <button class="ghost" id="themebtn">Theme</button>
    <button class="ghost" id="aboutbtn">About</button>
  </header>

  <div id="main">
    <div id="mapwrap">
      <svg id="map" role="img" aria-label="Map of places named in the SKZ inscription"></svg>
      <div class="mapctl tl"><div class="chipbar" id="legend"></div></div>
      <div class="mapctl br">
        <button class="sqbtn" id="zin"  title="Zoom in"  aria-label="Zoom in">+</button>
        <button class="sqbtn" id="zout" title="Zoom out" aria-label="Zoom out">&#8722;</button>
        <button class="sqbtn" id="zres" title="Reset view" aria-label="Reset view">&#10558;</button>
      </div>
      <div class="scalebar" id="scale"><div class="bar"></div><span></span></div>
      <div id="tip"></div>
    </div>
    <div id="panel">
      <div id="search">
        <label class="sr" for="q">Search places</label>
        <input id="q" type="search" placeholder="Search name, Greek, Parthian, line&hellip;" autocomplete="off">
      </div>
      <div id="body"></div>
    </div>
  </div>
</div>

s; Huyse leans to Kiš but flags the Parthian spelling against it","note":"candidate 1: Kāšγar, on Ptol. VI 15,3 Κασία χώρα, but too far northeast. Candidate 2: Kiš / older Keš/*Kaš = Šahrisabz, Kaškadarʼinskaja oblastʼ, giving a coherent south-to-north sequence"}],"rt":{"note":"not a march - the northeastern frontier line of the empire","columns":[{"column":"NE limes (south to north)","sequence":["…","Kāš","Sugd","Čāčestān"],"direction":"south to north","note":"EXCLUSIVE: these three lie OUTSIDE the Sasanian empire"}]},"key":1,"note":"Corrects the working assumption that §§2-3 carry no geography: the EASTERN FRONTIER subsections (§3.13ff.) do. For the geo layer this is a polygon/boundary fact, not a point: Kāš, Sugd and Čāčestān mark the limit and lie outside it."},"23.1":{"s":"23.1","sum":"THE THREE TARGETS OF CAMPAIGN 3, named as such: Syria, Cilicia, Cappadocia.","pg":86,"gr":"καὶ τὸ ἔθνος τῆς Συρίας καὶ τὸ ἔθνος τῆς Κιλικίας καὶ τὸ ἔθνος τῆς Καππαδοκίας","ln":23,"rt":{"note":"province-level objectives of campaign 3, each with its leading city","columns":[{"column":"campaign 3 objectives","sequence":["Syrien (Antiochien)","Kilikien (Tarsos)","Kappadokien (Kaisareia)"],"note":"triplet attested independently by Agathias, Synkellos and Kerdīr's inscriptions"}]},"key":1,"xr":["§13.3","§25.2","§28.3"]},"24.1":{"s":"24.1","sum":"On this campaign Šābuhr was accompanied not only by the high priest KERDĪR (KKZ 11) but also by MĀNĪ (Alexander of Lycopolis, c. Manich. opin. disp. 2) - the founder of Manichaeism travelling with the royal army.","pg":86,"gr":"ἐκείνῃ δὲ τῇ ἀγωγῇ","ln":24,"xr":["§10.2"]},"4.3":{"s":"4.3","sum":"RESOLVES THE GLOSSAR'S UNCERTAIN 'Ohrmezd-Ardašīr (?)': the CITY is ar. AL-AHWĀZ, and Huyse says its localisation and identification 'bereitet keinerlei Schwierigkeiten' - no difficulty whatever.","pg":39,"gr":"Ὡρμισδαρταξαρ","ln":4,"ids":[{"n":"Ohrmezd-Ardašīr (the city)","m":"al-Ahwāz","ml":"ar.","c":"sicher - 'bereitet keinerlei Schwierigkeiten'","note":"Distinct from the prince of the same name. Founder disputed: Ohrmezd I (Šahrestānīhā-ī Ērān, Šāhnāma) vs Ardašīr I (Ṭabarī, Ibn al-Aṯīr, Nihāyat al-Irab)."}],"corr":1,"key":1,"note":"UPDATES THE GLOSSAR RECORD for Ὡρμισδαρταξαρ, which carried identification 'Ohrmezd-Ardašīr (?)' with no modern name. The Kommentar supplies al-Ahwāz with no reservation."},"48.6":{"s":"48.6","sum":"NO GEOGRAPHIC CONTENT - recorded as a negative result. The section is a purely onomastic argument about the personal name Wardbed: whether it connects with arm. vardapet (< ap. *varda-pati-) or, as the Greek redactor's rendering of the genuinely Persian form shows, must go back to Old Iranian *vṛda-pati- (av. varəδa- 'rose').","pg":166,"gr":"Γουλβαδ τοῦ ἐπὶ τῆς ὑπηρεσίας","ln":48,"xr":["§46.5"]},"9.1":{"s":"9.1","sum":"Who is the unnamed 'Caesar' of grI 10? Rostovtzeff 1943 read him as Decius (249-251) and therefore treated the passage as a 'Breviarium' abridged from a fuller account.","pg":52,"gr":"καὶ ὁ Κ[αῖ]σαρ","ln":9,"xr":["§9.2"]},"campaign-structure":{"s":"campaign-structure","sum":"Structure of the SECOND campaign as a whole. Huyse insists it must be split into at least two distinct operations: (1) a rapid thrust along the Euphrates into Syria, culminating in the first capture of Antioch, in SPRING 253…","pg":58,"gr":"","rt":{"note":"two-operation model of campaign 2","columns":[{"column":"main","sequence":["Euphrates valley","Syria","Antiochien"],"date":"Frühjahr 253"},{"column":"crown prince","sequence":["Armenien","Kappadokien"],"date":"undatable","leader":"Ohrmezd-Ardašīr"},{"column":"later action (?)","sequence":["Dura","Kirkēsion"],"date":"probably a separate later action","certainty":"spekulativ; Huyse prefers this reading"}]},"xr":["§13.4","§15.1"]},"11.1":{"s":"11.1","sum":"THE KEY METHODOLOGICAL STATEMENT for the geographic layer: the conquests of the second campaign 'dürften mehr oder minder in chronologischer und geographischer Reihenfolge aufgelistet worden sein'…","pg":59,"gr":"Ἄναθαν πόλιν σὺν τῇ περιχώρῳ","ln":11,"ids":[{"n":"Ānāth","m":"ʿĀnāt (ʿĀna)","ml":"ar.","c":"sicher","note":"Called a 'Stadt' in ŠKZ but only a 'Festung' by Ammianus (XXIV 1,6 Anathan munimentum ... circumluitur fluentis Euphratis) and Theophylaktos Simokatta (τὸ Ἀνάθων φρούριον). Modern ʿĀnāt lies on the RIGHT BANK of the Euphrates, as already in Theophylaktos' day (7th c.), but originally it must have stood on an ISLAND in the Euphrates, as Isidore of Charax and Ammianus imply."}],"rt":{"note":"origin and direction of the second campaign","columns":[{"column":"main","sequence":["Iranian heartland","Pērōz-Šābuhr","Ānāth","…"],"direction":"from the SOUTHEAST, up the Euphrates","comparandum":"Julian later ran the same Regia via in reverse: Sura -> Ktesiphon"}]},"note":"The 'city + its territory' formula means every point in the geo layer is really a territory, not a dot. Worth carrying as a data caveat.","xr":["§13.4"]},"11.2":{"s":"11.2","sum":"A VERSION-LEVEL DIVERGENCE IN THE ITINERARY. The Greek has only Βίρθαν Ἀσπωράκου, but the PARTHIAN inserts a further fortress between Ānāth and Bīrthā-Aspōragān: byrt ʾrwpn, Bīrthā-Arūbān.","pg":59,"gr":"Βίρθαν Ἀσπωράκου","ln":11,"ids":[{"n":"Bīrthā-Arūbān","m":"Qreiye","ml":"ar.","c":"Honigmann's identification, widely followed","note":"Present in the PARTHIAN version only. Distinct from Bīrthā-Aspōragān (= Ḥalabīya)."}],"rt":{"note":"the Parthian march has one waypoint the Greek lacks","columns":[{"column":"main","sequence":["Ānāth","Bīrthā-Arūbān (Parthian only)","Bīrthā-Aspōragān"]}]},"xr":["§15.1"]},"11.4":{"s":"11.4","sum":"THE ARMY SPLIT - the fullest route reconstruction in the Kommentar.","pg":60,"gr":"Βαρβαλισσόν","ln":11,"rt":{"note":"army divides after Hierapolis; this is the content of the repo's Line 12, which has no § of its own","columns":[{"column":"main force (to Barbalissos)","sequence":["Ānāth","Bīrthā-Aspōragān","Sūrā","Barbalissos"],"note":"battle at Barbalissos"},{"column":"southern detachment","sequence":["Hierapolis","Rhephaneia","Berrhoia","Khalkis (ad Belum)","Apameia"],"direction":"south"},{"column":"northern detachment","sequence":["Hierapolis","Zeugma","Urima","Gindaros","Larmenaza","Seleukeia","Antiochien"],"direction":"north to Urima, then back southwest","purpose":"to shield the middle Euphrates from the Roman troops stationed in Mesopotamia"}]},"key":1,"xr":["§9.4"]},"13.2":{"s":"13.2","sum":"On the identity of the Seleukeia of grI 15. Huyse concludes that the 'other Seleukeia' (mpI [9], paI 7, grI 15) is the one lying behind the second attestation - i.e. the inscription names TWO different Seleukeias in the same line, which is why Glossar 2.3 splits the lemma three ways.","pg":62,"gr":"Σελεύκιαν","ln":13,"xr":["Glossar 2.3"]},"13.3":{"s":"13.3","sum":"HOW MANY TIMES DID ANTIOCH FALL? Opinions range from one to three captures.","pg":62,"gr":"Ἀντιόχιαν","ln":13,"corr":1,"key":1,"note":"The Syria-vs-Cilicia reattribution of Alexandreia and Nikopolis between the two lists is a genuine geographic fact for the layer: the same place is assigned to different regions in the two campaign accounts.","xr":["§22.2","§24.3","Glossar 2.3"]},"13.1":{"s":"13.1","sum":"A REVERSAL OF THE USUAL DIRECTION OF CORRUPTION. The Greek form differs from both Iranian equivalents by an initial Lambda.","pg":61,"gr":"Λαρμέναζα","ln":13,"ids":[{"n":"Larmenaza","m":"Armenāz","ml":"ar.","c":"sicher (cf. §13.1, Glossar 2.3)","note":"southeast of Antioch; possibly = Tarmanazi, attested 8th c. BC"}],"corr":1,"key":1,"note":"Methodologically important: the default assumption that the Iranian versions preserve and the Greek corrupts does NOT hold universally. Any name-authority decision in the geo layer has to be made per-place, not by rule.","xr":["Glossar 2.3"]},"13.3-dating":{"s":"13.3-dating","sum":"DATING THE TWO CAPTURES OF ANTIOCH - resolved. The second capture is not in doubt; the date of the FIRST swings between 253 and 256.","pg":63,"gr":"","ln":13,"ids":[{"n":"Philadelpheia (Lydia)","m":"Alaşehir","ml":"türk.","note":"Not a ŠKZ place; cited for the inscription of 18 Jan 255 that fixes Valerian's presence in the East."}],"key":1,"xr":["§22.2","§24.3"]},"13.4":{"s":"13.4","sum":"THE RAID PHASE. After the fall of Antioch several detachments of the Persian army evidently raided simultaneously in different directions.","pg":64,"gr":"Κύρρον","ln":13,"ids":[{"n":"Dikhōr","c":"nicht sicher zu lokalisieren","note":"its uncertainty is what breaks the reconstructable route"},{"n":"Dolikhē","m":"Dülük","ml":"türk."}],"rt":{"note":"three raid lines, on the Greek order (Huyse's preference)","columns":[{"column":"raid A","sequence":["Διχωρ","Δολίχη"]},{"column":"raid B","sequence":["Δοῦρα","Κορκουσίων"]},{"column":"raid C","sequence":["Γερμανίκια","Βάτνα","Χαναρ"]},{"column":"separate raids from Antioch","sequence":["Kyrrhos","Seleucia ad Belum","Alexandretta","Nikopolis"],"note":"three or rather four raids; a direct Alexandretta->Nikopolis push is unlikely on the terrain"},{"column":"southern axis","sequence":["Sinzara (Larissa)","Hamāth (Epiphaneia)","Aristia (Arethousa)"],"note":"possibly one further raid; all three given under their SYRIAC names in the Greek"}]},"key":1,"xr":["§24.3","§15.1","Glossar 2.3"]},"13.4-continued":{"s":"13.4-continued","sum":"ALTERNATIVE RECONSTRUCTION of the penultimate phase of campaign 2, framed by Huyse as the reading that least disturbs the order the inscription itself gives.","pg":64,"gr":"","ln":13,"rt":{"note":"Huyse's preferred reconstruction, least disruptive to the inscription's own order","columns":[{"column":"main army, penultimate phase","sequence":["Nikopolis","Dikhōr","Dolikhē","Germanikeia","(back)","Batnai","Khānar"],"note":"Batnai possibly the Mesopotamian one, cf. Glossar 2.3"},{"column":"Dura / Kirkēsion","sequence":["Kirkēsion","Dura"],"note":"anomalous in the list; Huyse prefers a LATER attack from the south over a return-march reading","certainty":"umstritten"}]},"key":1,"xr":["§15.1","Glossar 2.3"]},"15.1":{"s":"15.1","sum":"DURA, AND THE CAMPAIGN CHRONOLOGY. Dura was probably finally destroyed in October 255.","pg":70,"gr":"Δοῦραν","ln":15,"key":1,"note":"This year-by-year list is the dating spine for the whole route layer: it lets each march segment in routes.tsv be pinned to a campaigning season.","xr":["§16.1","§13.4"]},"15.1-dating":{"s":"15.1-dating","sum":"THE DATE OF DURA'S CAPTURE, argued from documents rather than narrative.","pg":69,"gr":"","ln":15,"key":1,"xr":["§15.1"]},"19.4":{"s":"19.4","sum":"THE GEOGRAPHIC-SEQUENCE ARGUMENT APPLIED AGAIN. Before the Parthian and Greek versions were known, Henning interpreted the Middle Persian name of this people/province as mpI [dl]dnyʾy, i.e. gr. Δαρδανία…","pg":76,"gr":"ἀπὸ Ἱσπανίας ἔθνους","ln":19,"corr":1,"note":"Third instance of the same method (with §19.3 Histria and §19.1 itself): Huyse repeatedly uses the NW-SE geographical ordering of the troop list as EVIDENCE for or against a proposed reading. The ordering is therefore not merely an observation but an argumentative tool - worth carrying explicitly in the geo layer. Hispania is in the list because it supplied the army's cavalry.","xr":["§19.1","§19.3"]},"17.1":{"s":"17.1","sum":"THE EXACT COUNT DISCREPANCIES IN BOTH CITY LISTS - the precise figures behind the '36 cities' problem.","pg":71,"gr":"ὁμοῦ πόλεις τριάκοντα ἑπτὰ [σὺν ταῖ]ς περ[ιχώρο]ις","ln":17,"corr":1,"key":1,"note":"Supersedes the looser figure in the §16 record. Practical consequence: NEITHER list's stated total can be used to validate the number of mapped points, and the Greek and Parthian versions do not even agree with each other on list 1.","xr":["§16.x-city-count"]},"16.x-city-count":{"s":"16.x-city-count","sum":"THE '36 CITIES' COUNT PROBLEM - a structural caveat for any map of the campaign lists.","pg":72,"gr":"","ln":16,"key":1,"note":"Practical consequence for the geo layer: the canonical figure 36 should not be used to validate the number of mapped points. 'Ἀλεξάνδριαν τὴν κατ' Ἰσόν' may be one place counted as two, and Karrhai/Edessa may be counted without being listed."},"19.3":{"s":"19.3","sum":"FOUR CANDIDATES FOR ONE NAME - the fullest treatment of the Ἀμαστρία crux, far richer than the Glossar's terse 'fehlerhaft für Asturia (?)'. The Greek form has to be explained from the Parthian ʾstryʾ, the Middle Persian being lost.","pg":75,"gr":"ἀπὸ Ἀμαστρίας ἔθνους","ln":19,"ids":[{"n":"ʾstryʾ / Ἀμαστρίας","c":"four competing candidates, none certain","note":"(1) Asturia in Spain - the Glossar's preference; (2) (Am)astria, a Greek city on the Paphlagonian Black Sea coast - what the Greek scribe himself understood; (3) (H)istria at the Danube mouth (Sprengling, Guey) - geographically the most coherent with the list sequence, but a city where a province is expected; (4) the landscape Istria, roughly modern Istria."}],"corr":1,"key":1,"note":"This is the strongest single argument for reading the Kommentar alongside the Glossar: the Glossar gives one identification, the Kommentar gives the four-way dispute behind it.","xr":["§19.2"]},"19.1":{"s":"19.1","sum":"WHAT THE 'ROMAN PROVINCES' LIST ACTUALLY IS - the interpretive key to the whole stretch.","pg":73,"gr":"ἀπὸ Γερμανῶν ἔθνου[ς]","ln":19,"rt":{"note":"not a march - the geographical ordering principle of the Roman troop list","columns":[{"column":"Roman troop contingents (campaign 3)","sequence":["Germanien","Rätien","Noricum","Dakien","Pannonien","Mösien","Hispanien","(H)istria / Amastria (?)","Asia","Bithynien","Thrakien","Galatien","Lykien","Lykaonien","Pamphylien (gr. Καμπανίας)","Kilikien","Kappadokien","Phönikien","Syrien","Judäa","Arabien","Mauretanien","Germanien","Rhodos (gr. Λυδίας)","Osrhoene (gr. Ἀσίας)","Mesopotamien"],"direction":"broadly NORTHWEST to SOUTHEAST","note":"order reconstructed from the Greek sequence grI 20-23; Huyse states the principle, not this exact list"}]},"key":1,"note":"THIS EXPLAINS THE CLUSTER OF REFERENT CORRECTIONS in repo Lines 19-21 (Καμπανίας=Pamphylia, Ἀμαστρίας=?, Λυδίας=Rhodos, Λυσιτανίας=Africa, Ἀσίας=Osrhoene, Συρίας=Isauria): they are garbled province names in a NW-SE geographic sequence. It is also why Huyse weighs the (H)istria proposal for Ἀμαστρία so seriously in §19.3 - it is the candidate that does not break the sequence. For the geo layer these rows should be modelled as ORIGINS OF ENEMY CONTINGENTS, not as conquests.","xr":["§21.2ff.","§19.3"]},"18.2":{"s":"18.2","sum":"Entry is a bare cross-reference to §22.2, where Valerian's capture is treated.","pg":73,"gr":"Οὐαλεριανὸς Καῖσαρ","ln":18,"xr":["§22.2"]},"19.x-lusitania-africa":{"s":"19.x-lusitania-africa","sum":"THE 'NO PEOPLE TWICE' RULE - which explains the whole referent-correction cluster in the troop list.","pg":77,"gr":"[-c.3/4-]ταν[ίας]","ln":19,"corr":1,"key":1,"note":"THIS IS THE UNIFYING RULE for the §§19-21 referent corrections. In the IRANIAN versions each province/people appears once. The Greek's apparent doublets - Συρίας at grI 21 and 22, Ἀσίας at grI 21 and 23 - are therefore scribal misreadings, which is precisely why the Glossar gives Συρία THREE referents (Asūrestān / Isauria / Syria) and Ἀσία TWO (provincia Asia / Osrhoene). The repo's duplicate-looking Greek rows in Lines 19-21 are genuine distinct entities, not data errors.","xr":["§21.2","§19.1","§20.3","§21.5"]},"24.x-campaign3-opening":{"s":"24.x-campaign3-opening","sum":"HOW CAMPAIGN 3 OPENED - three competing reconstructions, and Huyse's own.","pg":87,"gr":"","ln":24,"rt":{"note":"opening of campaign 3; the order in ŠKZ is itself disputed","columns":[{"column":"Huyse (preferred)","sequence":["Karrhai","Edessa","Samosata"],"note":"negotiations over Valerian's ransom at Samosata; city NOT taken at this point - it still struck Roman coin"},{"column":"Sprengling's reconstruction","sequence":["Samosata (camp)","Syrian coast","Alexandreia bei Issos"],"note":"a detachment of nomadic Arab troops acting without orders; main force then to Katabolos"},{"column":"Ensslin / Felix","sequence":["…","Samosata"],"note":"Samosata taken only on the RETURN leg, against the ŠKZ order"}]},"key":1,"xr":["§22.2"]},"24.3":{"s":"24.3","sum":"ALEXANDREIA AND NIKOPOLIS ARE THE ONLY TWO CITIES IN BOTH LISTS - and the reason is a change of regional attribution: here both are counted among the cities of CILICIA, whereas in the first list they count among those of SYRIA.","pg":88,"gr":"Ἀλεξάνδριαν","ln":24,"ids":[{"n":"Rhōssos","m":"Arsūz","ml":"ar.","note":"NOT named in ŠKZ although Philostratus counts it among Šābuhr's conquests; lies south of Alexandreia. A candidate addition to the campaign map, flagged as attested elsewhere but absent here."}],"key":1,"xr":["§13.3","Anm. 122"]},"24.4":{"s":"24.4","sum":"The Middle Persian form offered is only an attempted reconstruction; Huyse says he cannot tell whether the unambiguously legible Parthian form is a faulty rendering of the correct name.","pg":88,"gr":"Κατάβολον","ln":24,"ids":[{"n":"Katabolos","c":"Lokalisierung und Identifizierung unsicher","note":"Honigmann/Maricq: probably at or near Burnaz, at the mouth of the Burnaz-çayï"}],"xr":["Glossar 2.3"]},"25.2":{"s":"25.2","sum":"Reading of the Middle Persian form for Tarsos. Gignoux and Back read tlswsy without difficulty; Sprengling read tlswnyʾy.","pg":89,"gr":"Ταρσόν","ln":25,"note":"The systematic mp -l- > pa -r- substitution is useful for machine-matching Iranian name forms across the two versions."},"25.3":{"s":"25.3","sum":"A CITY PRESENT ONLY IN THE MIDDLE PERSIAN VERSION - the mirror image of the Parthian-only Bīrthā-Arūbān in §11.2. After Tarsos there follows a city named in the Middle Persian alone, whose name is moreover badly distorted; the stone reads mpI ʾgnstynʾy.","pg":89,"gr":"Ø","ln":25,"ids":[{"n":"Augusta","c":"Huyse follows Sprengling on the identification but rejects his placement in the march","note":"north (?) of Adana; reached as a side-trip from Adana, not on the return march"}],"rt":{"note":"a detour, not a return-march stop","columns":[{"column":"Cilician detour","sequence":["Adana","Augusta","(back to Adana)"],"note":"Abstecher von Adana aus"}]},"key":1},"25.4":{"s":"25.4","sum":"A COASTAL SUB-SEQUENCE. Zephyrion and the two cities following it - the important NAVAL BASE Sebastē and the strategically likewise significant Kōrykos - all lay on the SOUTH COAST OF CILICIA, SOUTHWEST OF TARSOS.","pg":89,"gr":"Ζεφύριν","ln":25,"rt":{"note":"three consecutive list entries form a coastal run southwest of Tarsos","columns":[{"column":"Cilician coast","sequence":["Tarsos","Zephyrion","Sebastē","Kōrykos"],"direction":"southwest along the south coast of Cilicia","note":"Sebastē an important naval base; Kōrykos likewise strategically significant"}]}},"25.4-continued":{"s":"25.4-continued","sum":"A PERSIAN DEFEAT REVERSES THE DIRECTION OF MARCH. At Pompeiopolis (Soloi) the Persians suffered a defeat against the Romans under the command of CALLISTUS (Zon., Ann. XII 23; Synk. 716,3 CSHB), which for the time being halted their forward drive WESTWARD.","pg":90,"gr":"","ln":25,"rt":{"note":"the westward advance is checked and the list turns back east","columns":[{"column":"main force, Cilicia","sequence":["(westward to Pompeiopolis/Soloi)","DEFEAT under Callistus","Agrippias","…","Epiphaneia"],"direction":"westward drive halted; march resumes EASTWARD into eastern Cilicia"}]},"key":1,"xr":["§25.4"]},"26.1":{"s":"26.1","sum":"Of the Iranian versions only the partly preserved MIDDLE PERSIAN has the correct name form here; the faulty Parthian form arose when the Parthian scribe misread mpB -z- for -g- in the Middle Persian exemplar.","pg":90,"gr":"Ἀγρίππαν","ln":26,"ids":[{"n":"Ἀγρίππαν","m":"Anavarza","ml":"türk.","note":"= Anazarbos; the Greek form looks like a personal name"}],"corr":1},"28.x-final-phase":{"s":"28.x-final-phase","sum":"THE FINAL PHASE AND THE RETURN ROUTE - the last full itinerary in the Kommentar.","pg":94,"gr":"","ln":28,"rt":{"note":"converging columns, then the return march over two named mountain passes","columns":[{"column":"southern column","sequence":["Dometiupolis","Bīrthā (?)","Rhakundia (?)","Laranda","Kybistra"],"direction":"north","note":"Bīrthā and Rhakundia not unambiguously localised"},{"column":"northern column","sequence":["Sebasteia","Komana","Kybistra"],"note":"returning south to the rendezvous"},{"column":"joint final action","sequence":["Kybistra","Ikonion"],"certainty":"vielleicht"},{"column":"return march","sequence":["Kybistra","Kilikische Pässe","Tarsos","Mopsuestia","Amanische Tore","Dolikhē","Karrhai"],"note":"the quickest route home at the end of the campaigning season, forced by the onset of winter"}]},"key":1,"note":"Kybistra is approached from two directions and so sits anomalously in the list order - a concrete case where the 'list order = march order' principle of §11.1 breaks down.","xr":["§29.1","§29.2","§25.4","Glossar 2.3"]},"27.6":{"s":"27.6","sum":"Confirms directly what §13.3 n.122 argued: the Antioch of grI 31 is probably NOT the better-known Antioch in Syria but ANTIOCHIA AD CRAGUM in Cilicia.","pg":93,"gr":"Ἀντιόχιαν","ln":27,"ids":[{"n":"Ἀντιόχιαν (grI 31)","c":"wohl eher nicht Syrian Antioch","note":"Antiochia ad Cragum, Cilicia - distinct from the Antioch of grI 15"}],"corr":1,"xr":["§13.3","Glossar 2.3"]},"28.3":{"s":"28.3","sum":"THE GREEK SCRIBE NAMED THE WRONG CITY'S NATIVE NAME - the most dramatic referent error in the inscription.","pg":95,"gr":"Μηιακαριρη","ln":28,"ids":[{"n":"Μηιακαριρη (as intended)","m":"Kayseri","ml":"türk.","c":"sicher - Cappadocian Kaisareia is meant","note":"native name MAZAKA (*Mazdakā- 'Mazdā-city'); Ptol. V 6,14; Str. XII 1,4. 2,7; Plin. VI 8; Amm. Marc. XX 9,1"},{"n":"Μηιακαριρη (as written)","c":"this is what the Greek form actually denotes","note":"a small fortress in upper Mesopotamia NW of Nisibis; Syriac name = 'cold springs', Amm. Marc. XVIII 6,16 fontes gelidi, Tabula Peutingeriana Aquae frigidae"}],"corr":1,"key":1,"note":"UPDATES THE GLOSSAR RECORD for Μηιακαριρη. The Glossar says only that the Greek gives a native name where the Iranian gives the Greek one; the Kommentar shows the Greek gives the native name of a DIFFERENT Kaisareia, a Mesopotamian fortress roughly 600 km from the Cappadocian city actually meant. For the geo layer: map to Kayseri, but record the Greek form's own referent separately.","xr":["§27.3","§28.2","§19.2"]},"27.x-westernmost":{"s":"27.x-westernmost","sum":"THE WESTERNMOST POINT OF THE WHOLE CAMPAIGN, and an out-and-back split.","pg":92,"gr":"","ln":27,"rt":{"note":"outward and return legs along the Cilician coast; Selinus marks the furthest west","columns":[{"column":"outward leg (Hinweg)","sequence":["Kelenderis","Anemurion","Selinus"],"direction":"westward","note":"SELINUS = the westernmost point reached in campaign 3"},{"column":"return leg (Rückweg)","sequence":["Myōnpolis","Antiochia ad Cragum","Seleucia ad Calycadnum"],"direction":"eastward","certainty":"requires transposing Antiochia ad Cragum and Myōnpolis in the list order"}]},"key":1,"note":"Selinus is the westward extreme of the whole campaign - a natural anchor for the map's extent. Note also footnote 152: the ordering principle itself is contested, chronological (Strobel) vs chronological-and-geographical (Huyse).","xr":["Glossar 2.3","§27.5","§28.2"]},"27.3":{"s":"27.3","sum":"Reading of the incompletely preserved Middle Persian form for Anemurion.","pg":92,"gr":"Ἀνεμοῦριν","ln":27,"xr":["§27.5","§28.2"]}},"pub":1}</script>
<script>
"use strict";
var D = JSON.parse(document.getElementById('skz-data').textContent);
var PL = D.places, SENT = D.sent, COAST = D.coast, KOMM = D.komm || {}, PUB = !!D.pub;

/* ---------- helpers ---------- */
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const el  = (t,c,h) => { const n=document.createElement(t); if(c)n.className=c; if(h!=null)n.innerHTML=h; return n; };
const fold = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ς/g,'σ').toLowerCase();

/* diacritic-insensitive span search; returns [start,end) in the ORIGINAL string */
function findSpan(hay, needle){
  if(!hay || !needle) return null;
  let n = '', map = [];
  for(let i=0;i<hay.length;i++){
    const f = fold(hay[i]);
    for(const c of f){ n += c; map.push(i); }
  }
  const nd = fold(needle);
  if(!nd) return null;
  const k = n.indexOf(nd);
  if(k < 0) return null;
  return [ map[k], map[Math.min(k+nd.length-1, map.length-1)] + 1 ];
}
function highlight(text, form){
  const sp = findSpan(text, form);
  if(!sp) return esc(text);
  return esc(text.slice(0,sp[0])) + '<mark>' + esc(text.slice(sp[0],sp[1])) + '</mark>' + esc(text.slice(sp[1]));
}

const GROUPS = [
  ['city',   'Cities, forts & sites', 'var(--city)', 'Sites'],
  ['region', 'Lands, regions & peoples', 'var(--region)', 'Lands']
];
const GCOL = {}; GROUPS.forEach(g => GCOL[g[0]] = g[2]);
const HTYPE = {ON:'Ortsname (place)', LN:'Landesname (land)', VN:'Volksname (people)',
               PN:'Personenname', 'Patr.':'patronymic', 'Adv.':'adverb'};
const VERDICT = {
  confirms:'Huyse confirms the identification', consistent:'consistent with Huyse',
  corrects:'Huyse corrects the identification', refines:'Huyse refines the identification',
  resolves:'Huyse resolves an ambiguity', downgrades:'Huyse is less certain',
  flags:'Huyse flags a problem', note:'editorial note', 'no Glossar lemma':'no Glossar lemma found'
};

PL.forEach(p => {
  p._s = fold([p.label,p.gr,p.pa,p.mp,p.lem,p.type,p.qlab,p.pltitle,
              (p.att||[]).map(a=>'line '+a.line+' '+a.gr+' '+a.pa+' '+a.mp).join(' '),
              (p.kd||[]).map(k=>(KOMM[k]&&KOMM[k].sum)||'').join(' ')
             ].filter(Boolean).join(' '));
});

/* ---------- state ---------- */
const BYID = {}; PL.forEach(p => BYID[p.id] = p);
const on = {city:true, region:true};
let sel = null, query = '', labelsOn = true, about = false;
const matches = p => (!query || p._s.indexOf(query) >= 0) && on[p.g];
const LOC = PL.filter(p=>p.xy), UNLOC = PL.filter(p=>!p.xy);

/* ---------- projection: equirectangular, standard parallel 36 N ---------- */
const LAT0 = 36, K0 = Math.cos(LAT0*Math.PI/180);
const proj = (lon,lat) => [lon*K0, -lat];

const svg = document.getElementById('map');
const NS  = 'http://www.w3.org/2000/svg';
const mk  = (t,a) => { const n=document.createElementNS(NS,t); for(const k in a) n.setAttribute(k,a[k]); return n; };

const gLand = mk('g',{}), gDots = mk('g',{}), gLbl = mk('g',{});
const landPath = mk('path',{fill:'var(--land)', stroke:'var(--coast)', 'stroke-width':'0.9',
                            'fill-rule':'evenodd', 'vector-effect':'non-scaling-stroke',
                            'stroke-linejoin':'round'});
landPath.setAttribute('d', COAST.map(r=>{
  let d = '';
  for(let i=0;i<r.length;i+=2){ const q = proj(r[i],r[i+1]); d += (i?'L':'M')+q[0].toFixed(3)+' '+q[1].toFixed(3); }
  return d+'Z';
}).join(''));
gLand.appendChild(landPath);
svg.appendChild(gLand); svg.appendChild(gDots); svg.appendChild(gLbl);

let view = {k:1,x:0,y:0}, W=900, H=600, K_FIT=1;

function fit(){
  const r = svg.getBoundingClientRect();
  W = Math.max(1, r.width||900); H = Math.max(1, r.height||600);
  svg.setAttribute('viewBox', '0 0 '+W+' '+H);
  let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;
  LOC.forEach(p=>{ const q=proj(p.xy[0],p.xy[1]);
    if(q[0]<x0)x0=q[0]; if(q[0]>x1)x1=q[0]; if(q[1]<y0)y0=q[1]; if(q[1]>y1)y1=q[1]; });
  const pad = 30;
  K_FIT = Math.min((W-2*pad)/(x1-x0), (H-2*pad)/(y1-y0));
  view.k = K_FIT;
  view.x = W/2 - K_FIT*(x0+x1)/2;
  view.y = H/2 - K_FIT*(y0+y1)/2;
  draw();
}
const scr = p => [ p.xy[0]*K0*view.k + view.x, -p.xy[1]*view.k + view.y ];
const rad = p => Math.min(9, 3.1 + 1.45*Math.sqrt((p.att||[]).length)) *
                 (view.k>K_FIT ? 1 + 0.12*Math.log(view.k/K_FIT) : 1);

/* lands, provinces, empires and peoples are drawn as open rings at an approximate
   centre point, settlements as solid dots; big symbols go down first so small ones
   stay clickable. Nothing in the "unres" group has coordinates, so it never draws. */
const isArea = p => p.g==='region';
const RANK = {region:0, city:1};

function draw(){
  hideTip();
  gLand.setAttribute('transform', 'translate('+view.x+' '+view.y+') scale('+view.k+')');
  gDots.textContent=''; gLbl.textContent='';

  const shown = LOC.filter(p => { const s=scr(p); return s[0]>-40 && s[0]<W+40 && s[1]>-30 && s[1]<H+30; });
  const order = shown.slice().sort((a,b)=>
    (RANK[a.g]-RANK[b.g]) || ((b.att||[]).length-(a.att||[]).length));

  order.forEach(p => {
    const s = scr(p), r = rad(p), hit = matches(p), col = GCOL[p.g], area = isArea(p);
    const g = mk('g',{class:'dot'+(hit?'':' dim')+(sel===p.id?' sel':''),
                      tabindex: hit?'0':'-1', role:'button',
                      'aria-label': p.label+', '+(p.att||[]).length+' attestations'});
    if(sel===p.id) g.appendChild(mk('circle',{cx:s[0].toFixed(1), cy:s[1].toFixed(1),
        r:(r*(area?1.3:1)+4).toFixed(1), fill:'none', stroke:'var(--ink)',
        'stroke-width':'1.4', 'stroke-opacity':'.8'}));
    const rr = (r*(area?1.3:1));
    const c = mk('circle',{cx:s[0].toFixed(1), cy:s[1].toFixed(1), r:rr.toFixed(1)});
    c.style.fill = col;
    c.style.stroke = area ? col : 'var(--panel)';
    c.style.strokeWidth = area ? '1.7px' : '1px';
    c.style.fillOpacity = area ? 0.14 : (p.cert==='certain' ? 0.92 : 0.5);
    if(p.cert!=='certain' && p.cert!=='probable') c.style.strokeDasharray = '2.4 1.8';
    g.appendChild(c);
    /* a comfortable target: the drawn symbol can be 4px across, which is not something
       anyone can hit with a mouse, let alone a finger */
    g.appendChild(mk('circle',{cx:s[0].toFixed(1), cy:s[1].toFixed(1),
                               r:Math.max(rr, 9).toFixed(1), fill:'transparent'}));
    /* selection is driven by pointerup on the svg (see below), not by a click handler
       here: while a pointer is captured the click event is retargeted to the <svg>, so a
       handler on this <g> would never fire for a real mouse press */
    g.dataset.pid = p.id;
    g.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); select(p.id); }});
    g.addEventListener('pointerenter', ()=>tip(p, s));
    g.addEventListener('pointerleave', hideTip);
    g.addEventListener('focus', ()=>tip(p, s));
    g.addEventListener('blur', hideTip);
    gDots.appendChild(g);
  });

  if(labelsOn){
    const boxes = [];
    const cand = shown.filter(matches).sort((a,b)=>
      ((a.id===sel?0:1)-(b.id===sel?0:1)) ||
      ((b.att||[]).length-(a.att||[]).length) || a.label.localeCompare(b.label));
    cand.forEach(p => {
      const s = scr(p), r = rad(p)*(isArea(p)?1.3:1);
      const txt = p.label.replace(/\s*\(.*\)$/,'');
      const w = txt.length*5.5, h = 11;
      const x = s[0]+r+3.5, y = s[1]+3.5;
      const box = [x-1, y-h, x+w+1, y+3];
      if(box[2]>W-2 || box[0]<2 || box[1]<2 || box[3]>H-2) return;
      for(let i=0;i<boxes.length;i++){
        const b = boxes[i];
        if(!(box[2]<b[0]||box[0]>b[2]||box[3]<b[1]||box[1]>b[3])) return;
      }
      boxes.push(box);
      const t = mk('text',{x:x.toFixed(1), y:y.toFixed(1), class:'lbl'+(sel===p.id?' sel':'')});
      t.textContent = txt;
      gLbl.appendChild(t);
    });
  }
  scalebar();
}

function scalebar(){
  /* one degree of longitude at the standard parallel, in projected units, is K0;
     on screen that is K0*view.k px, and measures 111.32*K0 km on the ground */
  const pxPerKm = (K0*view.k) / (111.32*K0);
  const box = document.getElementById('scale');
  const targets = [50,100,200,500,1000,2000];
  let km = targets[targets.length-1];
  for(let i=0;i<targets.length;i++){
    const w = targets[i]*pxPerKm;
    if(w >= 55 && w <= 190){ km = targets[i]; break; }
    if(w > 190){ km = targets[Math.max(0,i-1)]; break; }
  }
  box.querySelector('.bar').style.width = Math.round(km*pxPerKm)+'px';
  box.querySelector('span').textContent = km+' km';
}

const tipEl = document.getElementById('tip');
function tip(p, s){
  tipEl.innerHTML = esc(p.label) + ' <span style="color:var(--faint)">' + (p.att||[]).length + '&#215;</span>';
  tipEl.style.opacity = 1;
  const w = tipEl.offsetWidth;
  tipEl.style.left = Math.max(4, Math.min(W-w-4, s[0]-w/2)) + 'px';
  tipEl.style.top  = (s[1] - 30) + 'px';
}
const hideTip = () => { tipEl.style.opacity = 0; };

/* ---------- pan & zoom ---------- */
let drag = null;
svg.addEventListener('pointerdown', e=>{
  /* NB: no setPointerCapture here. Capturing a pointer retargets the following click to
     the capture element, so capturing on pointerdown silently stops every dot from being
     clickable. Capture is taken in pointermove, once a real drag is under way. */
  drag = {x:e.clientX, y:e.clientY, vx:view.x, vy:view.y, moved:false, id:e.pointerId, cap:false};
  svg.classList.add('drag');
});
svg.addEventListener('pointermove', e=>{
  if(!drag) return;
  const dx = e.clientX-drag.x, dy = e.clientY-drag.y;
  if(!drag.moved && Math.abs(dx)+Math.abs(dy) > 3){
    drag.moved = true;
    try{ svg.setPointerCapture(drag.id); drag.cap = true; }catch(_){}
  }
  if(!drag.moved) return;
  view.x = drag.vx+dx; view.y = drag.vy+dy; hideTip(); draw();
});

/* A press that did not turn into a drag is a tap: find what is under it and open that
   place. Hit-testing here rather than listening for click on each dot keeps selection
   working no matter how the browser retargets click during pointer capture. */
svg.addEventListener('pointerup', e=>{
  if(!drag) return;
  const tap = !drag.moved;
  if(drag.cap){ try{ svg.releasePointerCapture(drag.id); }catch(_){} }
  drag = null;
  svg.classList.remove('drag');
  if(!tap) return;
  const under = document.elementFromPoint(e.clientX, e.clientY);
  const g = under && under.closest ? under.closest('.dot') : null;
  if(g && g.dataset.pid) select(g.dataset.pid);
  else if(sel || about){ sel = null; about = false; render(); }
});
svg.addEventListener('pointercancel', ()=>{
  if(!drag) return;
  if(drag.cap){ try{ svg.releasePointerCapture(drag.id); }catch(_){} }
  drag = null;
  svg.classList.remove('drag');
});

function zoomAt(f, cx, cy){
  const k2 = Math.max(K_FIT*0.85, Math.min(K_FIT*26, view.k*f));
  const r = k2/view.k;
  view.x = cx - r*(cx - view.x);
  view.y = cy - r*(cy - view.y);
  view.k = k2; draw();
}
svg.addEventListener('wheel', e=>{
  e.preventDefault();
  const r = svg.getBoundingClientRect();
  zoomAt(Math.exp(-e.deltaY*0.0016), e.clientX-r.left, e.clientY-r.top);
}, {passive:false});
document.getElementById('zin').onclick  = ()=>zoomAt(1.45, W/2, H/2);
document.getElementById('zout').onclick = ()=>zoomAt(1/1.45, W/2, H/2);
document.getElementById('zres').onclick = ()=>fit();

/* ---------- legend ---------- */
const legend = document.getElementById('legend');
GROUPS.forEach(g => {
  const n = el('button','chip','<span class="sw" style="background:'+g[2]+'"></span>'+
              '<span class="full">'+esc(g[1])+'</span><span class="short">'+esc(g[3])+'</span>');
  n.setAttribute('aria-pressed','true'); n.title = 'Show or hide these places';
  n.onclick = () => { on[g[0]] = !on[g[0]]; n.setAttribute('aria-pressed', String(on[g[0]])); render(); };
  legend.appendChild(n);
});

/* ---------- panel: browse list ---------- */
const body = document.getElementById('body');

function listRow(p){
  const n = el('button','row'+(p.xy?'':' unloc')+(sel===p.id?' sel':''));
  n.innerHTML = '<span class="sw" style="background:'+GCOL[p.g]+'"></span>'+
    '<span class="nm">'+esc(p.label)+'<span class="gk">'+esc(p.gr||p.lem||'—')+'</span></span>'+
    '<span class="n">'+(p.att||[]).length+'&#215;</span>';
  n.onclick = ()=>select(p.id);
  return n;
}
/* A record off the map is off it for one of three quite different reasons, and lumping
   them together as "unresolved" hid the one group that is actually actionable. */
const UNMAPPED = [
  [p => p.cert !== 'unidentified' && p.cert !== 'not-a-place',
   'Named, not securely located',
   'Huyse names the place, but its localisation is disputed, unknown, or left open by the '+
   'gazetteers \u2014 Pleiades may hold the name with no coordinates. These are the ones worth chasing.'],
  [p => p.cert === 'unidentified',
   'Identification not possible',
   'Huyse states outright that the name cannot be identified or localised. Not a gap in this '+
   'dataset, and his \u00a748.6 confirms the court lists of \u00a7\u00a740\u201351 carry no geography either.'],
  [p => p.cert === 'not-a-place',
   'Not a place \u2014 tagging to review',
   'Huyse files these as personal names or as a concept, so the #LOC tag on those corpus rows is wrong.']
];

function renderList(){
  body.textContent='';
  const hitL = LOC.filter(matches), hitU = UNLOC.filter(matches);
  if(!hitL.length && !hitU.length){
    body.appendChild(el('div','empty','No place matches that search.')); return;
  }
  if(hitL.length){
    body.appendChild(el('div','listhead','On the map &middot; '+hitL.length));
    hitL.forEach(p=>body.appendChild(listRow(p)));
  }
  UNMAPPED.forEach(([test,title,why])=>{
    const g = hitU.filter(test);
    if(!g.length) return;
    body.appendChild(el('div','listhead',esc(title)+' &middot; '+g.length));
    body.appendChild(el('div','whynot',esc(why)));
    g.forEach(p=>body.appendChild(listRow(p)));
  });
  const rest = hitU.filter(p=>!UNMAPPED.some(u=>u[0](p)));
  if(rest.length){
    body.appendChild(el('div','listhead','Not localised &middot; '+rest.length));
    rest.forEach(p=>body.appendChild(listRow(p)));
  }
}

/* great-circle distance, km */
function km(a,b){
  const R=6371, t=Math.PI/180;
  const dla=(b[1]-a[1])*t, dlo=(b[0]-a[0])*t;
  const h=Math.sin(dla/2)**2 + Math.cos(a[1]*t)*Math.cos(b[1]*t)*Math.sin(dlo/2)**2;
  return 2*R*Math.asin(Math.min(1,Math.sqrt(h)));
}
function nearby(p){
  if(!p.xy) return [];
  return LOC.filter(o => o!==p)
    .map(o => ({p:o, km:km(p.xy, o.xy)}))
    .filter(o => o.km <= 30)
    .sort((a,b)=>a.km-b.km)
    .slice(0,6);
}


/* One Kommentar section. These are an editorial digest, not Huyse's printed wording,
   so they are framed differently from the verbatim Glossar block and always carry the
   book page. */
function kommBlock(key){
  const k = KOMM[key];
  if(!k) return null;
  const box = el('div','ksec');
  const badges = [];
  if(k.key)  badges.push('key passage');
  if(k.corr) badges.push('referent correction');
  if(k.rt)   badges.push('route');
  box.appendChild(el('div','khead',
    '<b>\u00a7'+esc(k.s)+'</b>'+
    (k.pg ? '<span>Band 2, p.\u00a0'+esc(k.pg)+'</span>' : '')+
    badges.map(b=>'<span class="kbadge">'+esc(b)+'</span>').join('')));
  if(k.gr && k.gr !== '\u00d8') box.appendChild(el('div','klem',esc(k.gr)));
  if(k.sum) box.appendChild(el('div','ksum',esc(k.sum)));
  (k.ids||[]).forEach(i => {
    let t = '<b>'+esc(i.n)+'</b>';
    if(i.m)  t += ' = '+esc(i.m)+(i.ml ? ' <span class="kdim" style="display:inline">('+esc(i.ml)+')</span>' : '');
    if(i.c)  t += ' <span class="kdim" style="display:inline">\u2014 '+esc(i.c)+'</span>';
    if(i.note) t += '<div class="kdim">'+esc(i.note)+'</div>';
    box.appendChild(el('div','kid',t));
  });
  if(k.rt){
    let t = '';
    (k.rt.columns||[]).forEach(c => {
      t += '<div><b>'+esc(c.column||'route')+'</b>'+
           (c.direction ? ' <span class="kdim" style="display:inline">'+esc(c.direction)+'</span>' : '')+
           '<br>'+esc((c.sequence||[]).join(' \u2192 '))+
           (c.note ? '<div class="kdim">'+esc(c.note)+'</div>' : '')+'</div>';
    });
    if(k.rt.note) t += '<div class="kdim">'+esc(k.rt.note)+'</div>';
    if(t) box.appendChild(el('div','krt',t));
  }
  if(k.note) box.appendChild(el('div','kdim',esc(k.note)));
  if(k.xr && k.xr.length)
    box.appendChild(el('div','kdim','See also '+esc(k.xr.join(', '))));
  if(k.fn && k.fn.length){
    const f = el('details','kfn');
    f.innerHTML = '<summary>'+k.fn.length+' footnote'+(k.fn.length===1?'':'s')+'</summary>'+
      k.fn.map(x=>'<div class="kdim"><b>'+esc(x.no)+'</b> '+esc(x.g)+'</div>').join('');
    box.appendChild(f);
  }
  return box;
}

/* ---------- panel: one place ---------- */
function renderDetail(p){
  body.textContent='';
  const d = el('div'); d.id = 'detail';

  const back = el('button','back','← All places');
  back.onclick = ()=>{ sel=null; render(); };
  d.appendChild(back);

  const head = el('div','dhead');
  head.appendChild(el('h2',null,esc(p.label)));
  const nAtt = (p.att||[]).length;
  let mh = '<span class="sw" style="width:.6rem;height:.6rem;border-radius:50%;background:'+
           GCOL[p.g]+';display:inline-block"></span><span>'+esc(p.type)+
           '</span><span class="tag">'+esc(p.cert)+'</span><span>'+nAtt+
           ' attestation'+(nAtt===1?'':'s')+'</span>';
  head.appendChild(el('div','meta',mh));
  d.appendChild(head);

  if(!p.xy){
    const u = UNMAPPED.find(x=>x[0](p));
    if(u) d.appendChild(el('sec',null,
      '<h3>Why this is not on the map</h3><div class="note">'+esc(u[2])+'</div>'));
  }

  /* other records sitting on (or beside) the same point — several ŠKZ places are
     one site under two names, and overlapping symbols are otherwise hard to pick apart */
  const near = nearby(p);
  if(near.length){
    const nb = el('sec'); nb.appendChild(el('h3',null,'At or near the same point'));
    const bar = el('div','nearby');
    near.forEach(o => {
      const b = el('button','nchip','<span class="sw" style="background:'+GCOL[o.p.g]+'"></span>'+
                 esc(o.p.label)+' <span style="color:var(--faint)">'+
                 (o.km<1 ? 'same spot' : Math.round(o.km)+' km')+'</span>');
      b.onclick = ()=>select(o.p.id);
      bar.appendChild(b);
    });
    nb.appendChild(bar);
    d.appendChild(nb);
  }

  /* the name in every version */
  const names = el('sec'); names.appendChild(el('h3',null,'The name'));
  const lem = p.lem ? esc(p.lem)+(p.ht ? ' <span style="color:var(--dim);font-size:.8rem">'+
              esc(HTYPE[p.ht]||p.ht)+'</span>' : '') : '';
  const rows = [['Greek',esc(p.gr)],['Parthian',esc(p.pa)],['Middle Persian',esc(p.mp)],
                ['Glossar lemma',lem],['Wikidata',esc(p.qlab)],['Pleiades',esc(p.pltitle)]];
  const tbl = el('table','names');
  tbl.innerHTML = rows.filter(r=>r[1]).map(r=>'<tr><th>'+r[0]+'</th><td>'+r[1]+'</td></tr>').join('');
  names.appendChild(tbl);
  d.appendChild(names);

  /* where it is named, with the sentence in all three versions */
  const a = el('sec'); a.appendChild(el('h3',null,'In the inscription'));
  (p.att||[]).forEach(at => {
    const s = SENT[at.line] || {};
    const box = el('div','att');
    box.appendChild(el('div','ln','ŠKZ line '+at.line+' &middot; '+esc(at.cat)));
    box.appendChild(el('div','form',[at.gr,at.pa,at.mp].filter(Boolean)
        .map(f=>'<span>'+esc(f)+'</span>').join('')));
    if(s.gr) box.appendChild(el('div','v','<b>Gr</b>'+highlight(s.gr, at.gr)));
    if(s.pa) box.appendChild(el('div','v','<b>Pa</b>'+highlight(s.pa, at.pa)));
    if(s.mp) box.appendChild(el('div','v','<b>MP</b>'+highlight(s.mp, at.mp)));
    a.appendChild(box);
  });
  if(!nAtt) a.appendChild(el('div','note','No attestation rows linked to this place.'));
  d.appendChild(a);

  /* Huyse's Glossar entry, verbatim */
  if(p.verb || p.chk || p.verd){
    const h = el('sec'); h.appendChild(el('h3',null,'Huyse, Griechisches Glossar'));
    if(p.verb) h.appendChild(el('div','verb',esc(p.verb)));
    else if(p.lem) h.appendChild(el('div','klem',esc(p.lem)+
      (p.ht ? ' <span class="kdim" style="display:inline">\u00b7 '+esc(HTYPE[p.ht]||p.ht)+'</span>' : '')));
    const bits = [];
    if(p.pg)   bits.push('Huyse 1999, Band 1, p.&nbsp;'+esc(p.pg));
    if(p.verd) bits.push(esc(VERDICT[p.verd]||p.verd));
    if(bits.length) h.appendChild(el('div','cite',bits.join(' &middot; ')));
    if(p.chk)  h.appendChild(el('div','note','<br>'+esc(p.chk)));
    d.appendChild(h);
  }

  /* Band 2. 110 of the 151 Glossar entries end with "-> Komm."; this is where that goes */
  const kd = p.kd || [], kc = p.kc || [];
  if(kd.length || kc.length){
    const k = el('sec'); k.appendChild(el('h3',null,'Huyse, Kommentar (Band 2)'));
    k.appendChild(el('div','kprov',
      (PUB
        ? 'In brief \u2014 the full discussion is in the book, at the pages below.'
        : 'A digest in English, summarised from the printed page \u2014 <b>not Huyse\u2019s wording</b>. '+
          'The Glossar entry above is verbatim; these are not. Section and page are given so the '+
          'original can be checked.')));
    kd.forEach(key => { const b = kommBlock(key); if(b) k.appendChild(b); });
    if(kc.length){
      const more = el('details','kmore');
      more.appendChild(el('summary',null, kd.length
        ? kc.length+' further section'+(kc.length===1?'':'s')+' on the same line'
        : 'Nothing on this place directly \u2014 '+kc.length+' section'+
          (kc.length===1?'':'s')+' on the same line'));
      kc.forEach(key => { const b = kommBlock(key); if(b) more.appendChild(b); });
      k.appendChild(more);
    }
    d.appendChild(k);
  }

  if(p.note){
    const n = el('sec'); n.appendChild(el('h3',null,'Editorial note'));
    if(p.note) n.appendChild(el('div','note',esc(p.note)));
    d.appendChild(n);
  }

  const i = el('sec'); i.appendChild(el('h3',null,'Identifiers'));
  let ih = '';
  if(p.plid) ih += '<div><span class="k">Pleiades</span><a href="https://pleiades.stoa.org/places/'+
                   esc(p.plid)+'" target="_blank" rel="noopener">'+esc(p.plid)+'</a></div>';
  if(p.qid)  ih += '<div><span class="k">Wikidata</span><a href="https://www.wikidata.org/wiki/'+
                   esc(p.qid)+'" target="_blank" rel="noopener">'+esc(p.qid)+'</a></div>';
  if(p.repoq && p.repoq !== p.qid)
             ih += '<div><span class="k">In corpus file</span>'+esc(p.repoq)+'</div>';
  if(p.xy)   ih += '<div><span class="k">Coordinates</span>'+p.xy[1].toFixed(4)+', '+p.xy[0].toFixed(4)+
                   (p.csrc ? ' <span style="color:var(--faint)">('+esc(p.csrc)+')</span>' : '')+'</div>';
  else       ih += '<div><span class="k">Coordinates</span><span style="color:var(--faint)">not localised</span></div>';
  i.appendChild(el('div','ids',ih));
  d.appendChild(i);

  body.appendChild(d);
  body.scrollTop = 0;
}

/* ---------- panel: colophon ---------- */
function renderAbout(){
  body.textContent='';
  const d = el('div'); d.id='detail';
  const back = el('button','back','← All places');
  back.onclick = ()=>{ about=false; render(); };
  d.appendChild(back);
  const head = el('div','dhead');
  head.appendChild(el('h2',null,'About this map'));
  head.appendChild(el('div','meta','<span>one self-contained file &middot; no external requests</span>'));
  d.appendChild(head);

  const s1 = el('sec'); s1.appendChild(el('h3',null,'What is mapped'));
  s1.appendChild(el('div','note',
    'Every place named in the trilingual inscription of Šābuhr I at the Kaʿba-ye Zartošt. '+
    'The '+PL.length+' place records behind the '+
    PL.reduce((n,p)=>n+(p.att||[]).length,0)+' <code>#LOC</code> / <code>#LOCderiv</code> attestations; '+
    LOC.length+' carry coordinates. The other '+UNLOC.length+' are off the map for three '+
    'quite different reasons, and the browse list separates them: '+
    UNLOC.filter(UNMAPPED[0][0]).length+' are named by Huyse but not securely located, '+
    UNLOC.filter(UNMAPPED[1][0]).length+' he states cannot be identified at all, and '+
    UNLOC.filter(UNMAPPED[2][0]).length+' are not places \u2014 personal names and one '+
    'concept, wrongly carrying a #LOC tag.<br><br>'+
    'Huyse\u2019s own \u00a748.6 records a negative result worth knowing: the court and family '+
    'lists of \u00a7\u00a740\u201351 carry no geography, so the satrapies named there '+
    '(Abr\u0113nag, And\u0113g\u0101n, *G\u014d(y)m\u0101n, Rind, \u0160ahrkerd) will not be '+
    'rescued by more commentary work.'));
  d.appendChild(s1);

  const s2 = el('sec'); s2.appendChild(el('h3',null,'Reading the symbols'));
  s2.appendChild(el('div','note',
    '<b>Solid dot</b> — a settlement or fort, at its own site.<br>'+
    '<b>Open ring</b> — a land, province, empire or people, drawn at an approximate '+
    'centre point; the ring is not its extent. A name of a people is mapped by the '+
    'territory it denotes, so the Goths and the Gelae are rings like any other area; '+
    'whether a name is an ethnonym is shown instead by Huyse’s <b>VN — Volksname</b> '+
    'beside the Glossar lemma.<br>'+
    '<b>Dashed outline</b> \u2014 the identification is uncertain.<br>'+
    '<b>Dashed outline</b> — the identification is uncertain or unresolved.<br>'+
    '<b>Symbol size</b> — number of attestations in the inscription.<br>'+
    'The scale bar measures east–west distance at 36°N (equirectangular projection, '+
    'standard parallel 36°N); distances elsewhere on the sheet are distorted.'));
  d.appendChild(s2);

  const s3 = el('sec'); s3.appendChild(el('h3',null,'Sources'));
  s3.appendChild(el('div','note',
    '<b>Corpus and named entities</b> — the ŠKZ trilingual corpus aligned at sentence and word level. '+
    'Greek after the digital epigraphy collection of the Packard Humanities Institute, using the edition of '+
    'Canali De Rossi (2004); Parthian after Huyse, via Jake Nabel’s parthiansources.com; '+
    'Middle Persian added by Farnoosh Shamsian. Line numbering follows Huyse (1999).<br><br>'+
    '<b>Identification, localisation and the German commentary</b> — P. Huyse (ed.), '+
    '<i>Die dreisprachige Inschrift Šābuhrs I. an der Kaʿba-i Zardušt (ŠKZ)</i>, '+
    'Corpus Inscriptionum Iranicarum III/I/I, London 1999; Band 1, <i>Griechisches Glossar</i> (pp. 114–171). '+
    (PUB
      ? 'This published copy cites Huyse by lemma, type and page only \u2014 his printed wording '+
        'is not reproduced here. Every identification below can be checked against the book at '+
        'the page given.<br><br>'
      : 'Entries are quoted verbatim from the printed page for scholarly consultation.<br><br>')+
    '<b>The commentary (Band 2)</b> \u2014 39 sections of Huyse\u2019s Kommentar covering the '+
    'Roman campaigns and the city lists, where he argues the contested identifications and '+
    'reconstructs the march routes. '+
    (PUB
      ? 'This published copy carries only what those sections establish \u2014 the identifications, '+
        'the modern names, his certainty wording, the routes and the corrections \u2014 with a '+
        'section and page for each. His prose, his argument and his footnotes are not reproduced. '
      : 'These appear as an <b>English digest, not his wording</b>, and are marked with a dashed '+
        'rule to keep them apart from the verbatim Glossar. ')+
    'Huyse deliberately put the geography of the province lists (\u00a7\u00a72\u20133) in the '+
    'Glossar rather than the Kommentar, so those lines have no commentary to show.<br><br>'+
    '<b>Gazetteer identifiers</b> \u2014 Pleiades (pleiades.stoa.org) and Wikidata.'));
  d.appendChild(s3);

  const s4 = el('sec'); s4.appendChild(el('h3',null,'Context'));
  s4.appendChild(el('div','note',
    'This geographic layer answers the Future Work section of F. Shamsian &amp; M. Berti, '+
    '“Annotating Named Entities in the Trilingual Inscription at Kaʿba-ye Zartošt (ŠKZ)”, '+
    '<i>Digital Classics Online</i> 12,2 (2026), '+
    '<a href="https://doi.org/10.11588/dco.2026.12.112297" target="_blank" rel="noopener">'+
    'doi:10.11588/dco.2026.12.112297</a>.'));
  d.appendChild(s4);

  const s5 = el('sec'); s5.appendChild(el('h3',null,'Using it'));
  s5.appendChild(el('div','note',
    'Drag to pan, scroll or +/− to zoom, ⌘ the legend chips to filter by kind of place. '+
    'Press <b>/</b> to jump to the search box, <b>Esc</b> to go back to the list. '+
    'Coastline generalised from Natural Earth (1:50m land), embedded in this file; '+
    'the page loads nothing from the network.'));
  d.appendChild(s5);

  body.appendChild(d); body.scrollTop = 0;
}

/* ---------- glue ---------- */
function select(id){
  about = false;
  sel = (sel===id) ? null : id;
  if(sel){
    const p = BYID[sel];
    if(p && p.xy){
      const s = scr(p);
      if(s[0]<20 || s[0]>W-20 || s[1]<20 || s[1]>H-20){ view.x += W/2-s[0]; view.y += H/2-s[1]; }
    }
  }
  render();
}
function render(){
  draw();
  if(about) renderAbout();
  else if(sel && BYID[sel]) renderDetail(BYID[sel]);
  else renderList();
}
document.getElementById('q').addEventListener('input', e=>{
  query = fold(e.target.value.trim());
  if(query) about = false;
  if(sel && !matches(BYID[sel])) sel = null;
  render();
});
/* selecting and deselecting both happen on pointerup, above */
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && (sel||about)){ sel=null; about=false; render(); }
  if(e.key==='/' && document.activeElement !== document.getElementById('q')){
    e.preventDefault(); document.getElementById('q').focus();
  }
});
const lb = document.getElementById('lblbtn');
lb.onclick = ()=>{ labelsOn = !labelsOn; lb.setAttribute('aria-pressed', String(labelsOn));
                   lb.style.opacity = labelsOn ? 1 : .5; draw(); };
document.getElementById('aboutbtn').onclick = ()=>{
  about = !about; if(about) sel = null; render();
};
document.getElementById('themebtn').onclick = ()=>{
  const cur = document.documentElement.getAttribute('data-theme');
  const dark = cur ? cur==='dark' : matchMedia('(prefers-color-scheme:dark)').matches;
  document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
  draw();
};
document.getElementById('counts').textContent =
  PL.length+' places · '+LOC.length+' localised · '+
  PL.reduce((n,p)=>n+(p.att||[]).length,0)+' attestations across 51 lines';

addEventListener('resize', fit);
fit();
render();
</script>
</body>
</html>
